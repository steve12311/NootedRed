name: Bug Report
description: Report a reproducible bug in this NootedRed fork.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please use the exact build you tested and provide reproducible steps.
        Do not upload unredacted EFI archives, serial numbers, UUIDs, tokens, or other personal data.
        This repository is an experimental fork; identify regressions separately from pre-existing upstream issues.
  - type: dropdown
    id: macos_family
    attributes:
      label: macOS version
      description: Choose the macOS release where the problem occurs.
      options:
        - macOS Tahoe
        - macOS Sequoia
        - macOS Sonoma
        - macOS Ventura
        - macOS Monterey
        - macOS Big Sur
        - macOS Catalina
        - Other / not listed
    validations:
      required: true
  - type: input
    id: macos_build
    attributes:
      label: Exact macOS version and build
      placeholder: "e.g. macOS 15.8.1 or 26.x, with the exact build number"
    validations:
      required: true
  - type: input
    id: nootedred_build
    attributes:
      label: Exact NootedRed version
      description: Include release asset (RELEASE/DEBUG) and commit SHA if you built it yourself.
      placeholder: "e.g. v0.9.0-pre-release.12, RELEASE; or commit SHA"
    validations:
      required: true
  - type: input
    id: cpu
    attributes:
      label: CPU / APU model
      placeholder: "e.g. AMD Ryzen 7 5800H (Cezanne)"
    validations:
      required: true
  - type: input
    id: gpu_pci
    attributes:
      label: AMD GPU PCI Device ID
      description: If unknown, write "unknown" and include your APU model.
      placeholder: "e.g. 1002:1638"
    validations:
      required: true
  - type: dropdown
    id: subsystem
    attributes:
      label: Affected subsystem
      options:
        - Display / desktop rendering
        - Metal / GPU compute
        - OpenGL / application rendering
        - Video decoding / VideoToolbox / VCN
        - DRM / protected playback
        - Startup / black screen / sleep-wake
        - Other / unknown
    validations:
      required: true
  - type: input
    id: smbios
    attributes:
      label: SMBIOS model
      placeholder: "e.g. MacBookPro16,2"
  - type: input
    id: opencore
    attributes:
      label: OpenCore version
      placeholder: "e.g. 1.0.x RELEASE"
  - type: textarea
    id: relevant_config
    attributes:
      label: Relevant boot arguments and other graphics patches
      description: List NootedRed flags, OCLP root patches, WhateverGreen, other GPU drivers, and any nonstandard settings. Redact identifiers.
      placeholder: "NootedRed boot args: ...\nOther graphics-related components: ..."
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Give numbered, repeatable steps; mention the application and operation involved.
      placeholder: "1. Start...\n2. Open...\n3. Observe..."
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Describe visual symptoms, crash, freeze, stutter, or GPU reset as precisely as possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: regression
    attributes:
      label: Comparison with previous builds
      description: If this is a regression, give the last known working and first broken versions; otherwise say "unknown".
  - type: textarea
    id: logs
    attributes:
      label: Diagnostics, logs, and screenshots
      description: Attach relevant .gpuRestart, .panic, .ips, or screenshots. Look under /Library/Logs/DiagnosticReports. Redact private details.
      placeholder: "Drag files here or paste a short relevant excerpt. If unavailable, explain why."
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checklist
      options:
        - label: I searched existing issues and checked for duplicates.
          required: true
        - label: I verified the macOS, hardware, and NootedRed build details above.
          required: true
        - label: I removed secrets and personal identifiers from shared logs or configuration files.
          required: true
