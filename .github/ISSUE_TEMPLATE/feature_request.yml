name: Feature Request
description: Suggest a NootedRed enhancement or new hardware/software support.
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        Describe the user-visible benefit and the hardware/software affected.
        Feature requests are not guarantees of support or delivery dates.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Display / Metal / OpenGL
        - VideoToolbox / VCN
        - DRM / protected playback
        - New APU / PCI device support
        - Performance / stability
        - Diagnostics / documentation / other
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Requested behavior
      description: What should NootedRed be able to do?
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Motivation / use case
      description: Why is this important, and who benefits?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Relevant hardware and macOS versions
      placeholder: "APU model / PCI ID / macOS build, if relevant"
  - type: textarea
    id: alternatives
    attributes:
      label: Existing workarounds or alternatives
      description: Describe existing approaches or why they are unsuitable.
  - type: textarea
    id: references
    attributes:
      label: References / related issues
      description: Provide logs, documentation, related issues, or technical references if useful.
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checklist
      options:
        - label: I searched existing issues and requests for duplicates.
          required: true
        - label: This request describes a concrete feature rather than a general support question.
          required: true
