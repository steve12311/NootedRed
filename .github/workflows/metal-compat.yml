name: Metal descriptor compatibility

on:
  pull_request:
    paths:
      - 'tools/metal-compat/**'
      - 'docs/metal-descriptor-abi.md'
      - '.github/workflows/metal-compat.yml'
  push:
    paths:
      - 'tools/metal-compat/**'
      - 'docs/metal-descriptor-abi.md'
      - '.github/workflows/metal-compat.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semantics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 tools/metal-compat/build.py test
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 tools/metal-compat/build.py build
      - run: python3 tools/metal-compat/build.py build-test
      - run: python3 tools/metal-compat/build.py build-probe
