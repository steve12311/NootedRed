name: CI

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: macos-latest
    permissions:
      contents: write
      discussions: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: "recursive"
      - name: Test shared-cache coordinator
        run: |
          python3 tools/test_display_coordinator_kext.py
          python3 tools/test_display_cross_module_gate.py
          python3 tools/test_display_cross_module_gate.py --sanitize
          python3 tools/test_process_filter.py
          python3 tools/test_fvrc_mapping_probe.py
      - name: Test EC backlight service
        run: |
          python3 tools/test_ec_backlight_service.py
          python3 tools/test_ec_backlight_service.py --thread-sanitizer
      - run: xcodebuild -configuration Debug -arch x86_64 build
      - run: xcodebuild -configuration Research\ Release -arch x86_64 build
      - run: xcodebuild -configuration Release -arch x86_64 build
      - name: Check IOKit class symbols
        run: |
          python3 tools/test_ec_backlight_binary.py build/Debug/NootedRed.kext
          python3 tools/test_ec_backlight_binary.py 'build/Research Release/NootedRed.kext'
          python3 tools/test_ec_backlight_binary.py build/Release/NootedRed.kext
      - name: Upload to Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/*/*.zip
      - name: Upload build
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          shopt -s nullglob
          files=(build/*/*.zip)
          [ ${#files[@]} -gt 0 ] || { echo "No zip files found"; exit 1; }
          NOTES=$(awk -v ver="${{ github.ref_name }}" '
            $0 ~ "^## " ver "([[:space:]]|$)" {flag=1; next}
            /^## / {flag=0}
            flag
          ' CHANGELOG.md | sed 's/^### /## /')

          [ -n "$NOTES" ] || {
            echo "No changelog entry found for ${{ github.ref_name }}"
            exit 1
          }

          echo "$NOTES" | gh release create "${{ github.ref_name }}" "${files[@]}" \
            -t "${{ github.ref_name }}" \
            --verify-tag \
            --fail-on-no-commits \
            --discussion-category Announcements \
            -F -
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  analyse-clang:
    name: Analyse Clang
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: "recursive"
      - run: xcodebuild analyze -quiet -configuration Debug -arch x86_64 CLANG_ANALYZER_OUTPUT=plist-html CLANG_ANALYZER_OUTPUT_DIR="$(pwd)/clang-analyze" && [ "$(find clang-analyze -name "*.html")" = "" ]
      - run: xcodebuild analyze -quiet -configuration Research\ Release -arch x86_64 CLANG_ANALYZER_OUTPUT=plist-html CLANG_ANALYZER_OUTPUT_DIR="$(pwd)/clang-analyze" && [ "$(find clang-analyze -name "*.html")" = "" ]
      - run: xcodebuild analyze -quiet -configuration Release -arch x86_64 CLANG_ANALYZER_OUTPUT=plist-html CLANG_ANALYZER_OUTPUT_DIR="$(pwd)/clang-analyze" && [ "$(find clang-analyze -name "*.html")" = "" ]
